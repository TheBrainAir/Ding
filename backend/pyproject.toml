[project]
name = "ding-backend"
version = "0.1.0"
description = "Ding: voice AI waiter backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.163.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "RUF005"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.per-file-ignores]
# Prompt and canned-reply text: long lines are deliberate.
"app/services/prompts.py" = ["E501"]
"app/services/menu_import.py" = ["E501"]
"app/services/waiter.py" = ["E501"]
"app/seed.py" = ["E501"]
