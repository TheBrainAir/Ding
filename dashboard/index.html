<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Button Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centered column, header with tabs. shadcn zinc tokens, dark only by choice. */
:root{
  color-scheme:dark;
  --background:240 10% 3.9%; --foreground:0 0% 98%;
  --card:240 10% 3.9%; --card-foreground:0 0% 98%;
  --muted:240 3.7% 15.9%; --muted-foreground:240 5% 64.9%;
  --secondary:240 3.7% 15.9%; --secondary-foreground:0 0% 98%;
  --accent:240 3.7% 15.9%; --accent-foreground:0 0% 98%;
  --primary:0 0% 98%; --primary-foreground:240 5.9% 10%;
  --destructive:0 72% 51%;
  --border:240 3.7% 15.9%; --input:240 3.7% 15.9%; --ring:240 4.9% 83.9%;
  --chart-1:0 0% 96%; --chart-2:0 0% 62%; --chart-3:0 0% 36%;
  --warn:0 0% 98%;
  --radius:.6rem;
}
*{border-color:hsl(var(--border))}
body{margin:0;background:hsl(var(--background));color:hsl(var(--foreground));font-family:Geist,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:hsl(var(--background));z-index:40}
[hidden]{display:none!important}
.tnum{font-variant-numeric:tabular-nums}
/* ReactBits-style effects (only applied when Effects is on) */
@keyframes fadeUp{from{opacity:.25;transform:translateY(8px)}to{opacity:1;transform:none}}
.fx-reveal{animation:fadeUp .5s cubic-bezier(.2,.7,.2,1) both}
.fx-spot{position:relative;overflow:hidden}
.fx-spot::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(320px circle at var(--x,50%) var(--y,50%),hsl(0 0% 100%/.07),transparent 60%)}
.fx-spot:hover::before{opacity:1}
@keyframes sheetIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet-in{animation:sheetIn .25s ease-out}
.overlay-in{animation:fadeIn .2s ease-out}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast-in{animation:toastIn .2s ease-out}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="root"></div>

<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: {
    border: 'hsl(var(--border) / <alpha-value>)', input: 'hsl(var(--input) / <alpha-value>)', ring: 'hsl(var(--ring) / <alpha-value>)',
    background: 'hsl(var(--background) / <alpha-value>)', foreground: 'hsl(var(--foreground) / <alpha-value>)',
    primary: { DEFAULT: 'hsl(var(--primary) / <alpha-value>)', foreground: 'hsl(var(--primary-foreground) / <alpha-value>)' },
    secondary: { DEFAULT: 'hsl(var(--secondary) / <alpha-value>)', foreground: 'hsl(var(--secondary-foreground) / <alpha-value>)' },
    muted: { DEFAULT: 'hsl(var(--muted) / <alpha-value>)', foreground: 'hsl(var(--muted-foreground) / <alpha-value>)' },
    accent: { DEFAULT: 'hsl(var(--accent) / <alpha-value>)', foreground: 'hsl(var(--accent-foreground) / <alpha-value>)' },
    destructive: 'hsl(var(--destructive) / <alpha-value>)',
    card: { DEFAULT: 'hsl(var(--card) / <alpha-value>)', foreground: 'hsl(var(--card-foreground) / <alpha-value>)' },
    warn: 'hsl(var(--warn) / <alpha-value>)'
  },
  fontFamily: { sans: ['Geist', 'ui-sans-serif', 'system-ui', 'sans-serif'], mono: ['"Geist Mono"', 'ui-monospace', 'monospace'] },
  borderRadius: { lg: 'var(--radius)', md: 'calc(var(--radius) - 2px)', sm: 'calc(var(--radius) - 4px)' }
} } };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const cn = (...a) => a.filter(Boolean).join(' ');
const readPref = (k, d) => { try { return localStorage.getItem(k) || d; } catch (e) { return d; } };
const writePref = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const num = n => Math.round(n).toLocaleString('en-US');
const listJoin = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];

/* ---------------- dates + demo usage ---------------- */
const atMidnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const keyOf = d => d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
const fmt = o => new Intl.DateTimeFormat('en-US', o);
const fMD = fmt({ month: 'short', day: 'numeric' }), fWD = fmt({ weekday: 'short', month: 'short', day: 'numeric' });
const fMon = fmt({ month: 'short' }), fMonY = fmt({ month: 'long', year: 'numeric' });
const range = (a, b) => keyOf(a) === keyOf(b) ? fMD.format(a) : `${fMD.format(a)} – ${fMD.format(b)}`;

const FUNCS = [
  { key: 'translate', label: 'Translation', color: 'hsl(var(--chart-1))' },
  { key: 'read', label: 'Read aloud', color: 'hsl(var(--chart-2))' },
  { key: 'allergen', label: 'Allergen info', color: 'hsl(var(--chart-3))' }
];
// Demo data, one record per day. Replace with the button's real log.
const USAGE = (() => {
  let s = 20261114; const r = () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296;
  const N = 430, out = [], today = atMidnight(new Date()), W = [1.05, .62, .66, .74, .88, 1.3, 1.42];
  for (let i = N - 1; i >= 0; i--) {
    const d = addDays(today, -i), base = 78 * W[d.getDay()] * (.5 + (N - i) / N * .8) * (.9 + r() * .2);
    const season = 1 + .22 * Math.sin(((d.getMonth() + d.getDate() / 31 - 3.5) / 12) * 2 * Math.PI);
    out.push({ date: d, translate: Math.round(base * season * (.4 + r() * .12)), read: Math.round(base * (.13 + r() * .05)), allergen: Math.round(base * (.29 + r() * .09)) });
  }
  return out;
})();
const BY = new Map(USAGE.map(x => [keyOf(x.date), x]));
const TODAY = USAGE[USAGE.length - 1].date;
function sum(a, b) {
  const t = { translate: 0, read: 0, allergen: 0 };
  for (let d = a; d <= b; d = addDays(d, 1)) { const x = BY.get(keyOf(d)); if (x) FUNCS.forEach(f => t[f.key] += x[f.key]); }
  t.total = t.translate + t.read + t.allergen; return t;
}
function computeUsage(mode) {
  const b = [];
  if (mode === 'daily') for (let i = 13; i >= 0; i--) { const d = addDays(TODAY, -i); b.push({ start: d, end: d, label: fMD.format(d), title: fWD.format(d) }); }
  else if (mode === 'weekly') for (let i = 11; i >= 0; i--) { const e = addDays(TODAY, -7 * i), s0 = addDays(e, -6); b.push({ start: s0, end: e, label: fMD.format(s0), title: range(s0, e) }); }
  else for (let i = 5; i >= 0; i--) {
    const s0 = new Date(TODAY.getFullYear(), TODAY.getMonth() - i, 1), last = new Date(s0.getFullYear(), s0.getMonth() + 1, 0), partial = last > TODAY;
    b.push({ start: s0, end: partial ? TODAY : last, partial, label: fMon.format(s0), title: fMonY.format(s0) + (partial ? ' (so far)' : '') });
  }
  b.forEach(x => Object.assign(x, sum(x.start, x.end)));
  const start = b[0].start, len = Math.round((TODAY - start) / 864e5) + 1;
  const cur = sum(start, TODAY), prev = sum(addDays(start, -len), addDays(start, -1));
  return { buckets: b, cur, prev, label: range(start, TODAY) };
}
function change(c, p) {
  if (!p) return { text: 'New', tone: 'muted' };
  const d = (c - p) / p * 100, a = Math.abs(d);
  if (a < .5) return { text: '0%', tone: 'muted' };
  return { text: `${d > 0 ? '+' : '−'}${a < 10 ? a.toFixed(1) : Math.round(a)}%`, tone: d > 0 ? 'up' : 'down' };
}

/* ---------------- allergens ---------------- */
const ALLERGENS = [
  ['Gluten', 'wheat,flour,bread,breadcrumb,cornbread,flatbread,sourdough,brioche,baguette,naan,crouton,pasta,spaghetti,linguine,penne,macaroni,noodle,barley,rye,couscous,semolina,bulgur,farro,spelt,seitan,soy sauce,tortilla,pita,panko,malt,wonton', 'gluten-free,gluten free,rice noodle,glass noodle,rice flour,corn tortilla,almond flour,coconut flour,chickpea flour,corn flour,cornflour,tapioca flour'],
  ['Dairy', 'milk,buttermilk,cheese,butter,cream,yogurt,yoghurt,ghee,whey,parmesan,mozzarella,feta,ricotta,cheddar,paneer,mascarpone,halloumi,brie,custard', 'coconut milk,almond milk,oat milk,soy milk,rice milk,coconut cream,peanut butter,almond butter,nut butter,cocoa butter,apple butter,dairy-free,dairy free,non-dairy,vegan,plant-based,cream of tartar'],
  ['Eggs', 'egg,mayonnaise,mayo,aioli,meringue', 'egg-free,egg free,eggless,vegan'],
  ['Peanuts', 'peanut,groundnut,satay', 'peanut-free,peanut free'],
  ['Tree nuts', 'almond,walnut,cashew,pecan,pistachio,hazelnut,macadamia,brazil nut,pine nut,praline,marzipan,frangipane', 'nut-free,nut free'],
  ['Soy', 'soy,soya,tofu,edamame,miso,tempeh,tamari', 'soy-free,soy free'],
  ['Fish', 'fish,salmon,tuna,cod,anchovy,anchovies,sardine,trout,tilapia,halibut,mackerel,haddock,bonito,worcestershire', ''],
  ['Shellfish', 'shrimp,prawn,crab,lobster,clam,mussel,oyster,scallop,crayfish,crawfish,langoustine', ''],
  ['Sesame', 'sesame,tahini,halva,zaatar', 'sesame-free,sesame free']
].map(([name, kw, not]) => ({ name, re: new RegExp('\\b(?:' + kw.split(',').join('|') + ')(?:e?s)?\\b', 'i'), not: not ? not.split(',') : [] }));
function detect(ings) {
  const m = new Map();
  ings.forEach(i => { const l = i.toLowerCase(); ALLERGENS.forEach(a => { if (a.re.test(l) && !a.not.some(x => l.includes(x))) m.set(a.name, [...(m.get(a.name) || []), i]); }); });
  return m;
}
const finalList = (ings, add, rm) => { const d = detect(ings); return ALLERGENS.map(a => a.name).filter(n => (d.has(n) && !rm.includes(n)) || add.includes(n)); };

/* ---------------- menu storage (same format as the detailed version) ---------------- */
const STORE = 'smartbutton.menu.v2';
const SAMPLES = [
  ['Pad Thai', 'rice noodles, shrimp, peanuts, egg, tamarind, fish sauce, bean sprouts, lime'],
  ['Margherita Pizza', 'wheat flour, tomato, mozzarella, basil, olive oil'],
  ['Caesar Salad', 'romaine, croutons, parmesan, anchovies, egg yolk, lemon, Worcestershire sauce'],
  ['Chickpea Curry', 'chickpeas, coconut milk, spinach, tomato, cumin, basmati rice'],
  ['Sesame Tofu Bowl', 'tofu, soy sauce, sesame seeds, brown rice, broccoli, scallions']
].map(([name, i], k) => ({ id: 's' + (k + 1), name, ingredients: i.split(', '), sample: true }));
const uid = () => 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const norm = m => ({ id: m.id || uid(), name: String(m.name || ''), photo: typeof m.photo === 'string' ? m.photo : '', ingredients: Array.isArray(m.ingredients) ? m.ingredients.map(String) : [], addAllergens: m.addAllergens || [], removeAllergens: m.removeAllergens || [], sample: !!m.sample });
function loadMeals() {
  try { for (const k of [STORE, 'smartbutton.menu.v1']) { const v = JSON.parse(localStorage.getItem(k)); if (Array.isArray(v)) return v.map(norm); } } catch (e) {}
  return SAMPLES.map(norm);
}

/* ---------------- shadcn-style primitives ---------------- */
const btnBase = 'inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring disabled:opacity-50 [&_svg]:size-4 [&_svg]:shrink-0';
const btnVariant = {
  default: 'bg-primary text-primary-foreground shadow hover:bg-primary/90',
  outline: 'border border-input bg-background shadow-sm hover:bg-accent hover:text-accent-foreground',
  ghost: 'hover:bg-accent hover:text-accent-foreground',
  secondary: 'bg-secondary text-secondary-foreground hover:bg-secondary/80',
  destructive: 'bg-destructive text-white shadow-sm hover:bg-destructive/90'
};
const btnSize = { default: 'h-9 px-4', sm: 'h-8 px-3 text-xs', icon: 'h-8 w-8' };
const Button = React.forwardRef(({ variant = 'default', size = 'default', className, ...p }, ref) => <button ref={ref} type="button" className={cn(btnBase, btnVariant[variant], btnSize[size], className)} {...p} />);
const Input = React.forwardRef(({ className, ...p }, ref) => <input ref={ref} className={cn('flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring', className)} {...p} />);
const Badge = ({ tone = 'outline', className, ...p }) => <span className={cn('inline-flex items-center rounded-md border px-2 py-0.5 text-xs font-medium',
  tone === 'warn' ? 'border-foreground/25 bg-foreground/10 text-foreground' : tone === 'secondary' ? 'border-transparent bg-secondary text-secondary-foreground' : 'text-muted-foreground', className)} {...p} />;

function Card({ fx, className, children, ...p }) {
  const onMove = e => { const r = e.currentTarget.getBoundingClientRect(); e.currentTarget.style.setProperty('--x', e.clientX - r.left + 'px'); e.currentTarget.style.setProperty('--y', e.clientY - r.top + 'px'); };
  return <div className={cn('rounded-xl border bg-card text-card-foreground shadow-sm', fx && 'fx-spot', className)} onMouseMove={fx ? onMove : undefined} {...p}>{children}</div>;
}
function Tabs({ value, onChange, items, label }) {
  return <div role="tablist" aria-label={label} className="inline-flex h-9 items-center rounded-lg bg-muted p-1 text-muted-foreground">
    {items.map(([v, t]) => <button key={v} type="button" role="tab" aria-selected={value === v} onClick={() => onChange(v)}
      className={cn('inline-flex h-7 items-center rounded-md px-3 text-sm font-medium transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring', value === v ? 'bg-background text-foreground shadow' : 'hover:text-foreground')}>{t}</button>)}
  </div>;
}
function Switch({ checked, onChange, label }) {
  return <button type="button" role="switch" aria-checked={checked} aria-label={label} onClick={() => onChange(!checked)}
    className={cn('inline-flex h-5 w-9 shrink-0 items-center rounded-full border-2 border-transparent transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring', checked ? 'bg-primary' : 'bg-input')}>
    <span className={cn('block h-4 w-4 rounded-full bg-background shadow transition-transform', checked ? 'translate-x-4' : 'translate-x-0')} />
  </button>;
}
const Icon = ({ d, className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" className={cn('size-4', className)} dangerouslySetInnerHTML={{ __html: d }} />;
const I = {
  plus: '<path d="M12 5v14M5 12h14"/>', search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  pencil: '<path d="M4 20h4L19 9l-4-4L4 16v4z"/>', trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>', image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>', check: '<path d="M20 6 9 17l-5-5"/>',
  play: '<path d="M7 4v16l13-8z"/>',
  sparkles: '<path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2-2.2-.8 2.2-.8z"/>'
};

/* ReactBits-style CountUp */
function CountUp({ value, fx }) {
  const [v, setV] = useState(fx ? 0 : value), from = useRef(fx ? 0 : value);
  useEffect(() => {
    if (!fx) { setV(value); from.current = value; return; }
    const a = from.current, t0 = performance.now(); let raf;
    const step = t => { const k = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 3), x = a + (value - a) * e; setV(x); from.current = x; if (k < 1) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step); return () => cancelAnimationFrame(raf);
  }, [value, fx]);
  return <span className="tnum">{num(v)}</span>;
}
const Reveal = ({ fx, i = 0, children, className }) => <div className={cn(fx && 'fx-reveal', className)} style={fx ? { animationDelay: i * 70 + 'ms' } : undefined}>{children}</div>;

/* ---------------- Usage ---------------- */
function BarChart({ buckets }) {
  const ref = useRef(null), [w, setW] = useState(0), [hi, setHi] = useState(-1);
  useEffect(() => { const ro = new ResizeObserver(([e]) => setW(Math.floor(e.contentRect.width))); ro.observe(ref.current); return () => ro.disconnect(); }, []);
  const H = w < 520 ? 220 : 260, P = { l: 36, r: 0, t: 8, b: 26 }, ph = H - P.t - P.b;
  const max = Math.max(1, ...buckets.map(b => b.total));
  const p10 = Math.pow(10, Math.floor(Math.log10(max / 4))), m = max / 4 / p10;
  const step = (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p10, top = Math.ceil(max / step) * step;
  const y = v => P.t + ph - v / top * ph, slot = (w - P.l - P.r) / buckets.length, bw = Math.min(36, slot * .6);
  const every = Math.max(1, Math.ceil((Math.max(...buckets.map(b => b.label.length)) * 6.6 + 10) / slot));
  const at = e => { const r = ref.current.getBoundingClientRect(), i = Math.floor((e.clientX - r.left - P.l) / slot); return i >= 0 && i < buckets.length ? i : -1; };
  const onKey = e => {
    const n = buckets.length;
    if (e.key === 'ArrowRight') setHi(i => i < 0 ? 0 : Math.min(n - 1, i + 1));
    else if (e.key === 'ArrowLeft') setHi(i => i < 0 ? n - 1 : Math.max(0, i - 1));
    else if (e.key === 'Escape') setHi(-1); else return;
    e.preventDefault();
  };
  const b = buckets[hi], cx = hi >= 0 ? P.l + slot * hi + slot / 2 : 0;
  return <div ref={ref} className="relative select-none rounded-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring" style={{ touchAction: 'pan-y' }}
    tabIndex={0} role="group" aria-label="Button presses chart. Use left and right arrow keys for details."
    onPointerMove={e => setHi(at(e))} onPointerDown={e => setHi(at(e))} onPointerLeave={e => e.pointerType === 'mouse' && setHi(-1)} onKeyDown={onKey} onBlur={() => setHi(-1)}>
    {w > 0 && <svg width={w} height={H} aria-hidden="true" className="block">
      {Array.from({ length: Math.round(top / step) + 1 }, (_, k) => k).map(k => { const v = step * k; const yy = Math.round(y(v)) + .5; return <g key={k}>
        <line x1={P.l} x2={w} y1={yy} y2={yy} stroke="hsl(var(--border))" strokeDasharray={k ? '3 3' : undefined} />
        <text x={P.l - 8} y={yy + 4} textAnchor="end" fontSize="11" fill="hsl(var(--muted-foreground))" className="tnum">{v >= 1000 ? (v / 1000) + 'k' : v}</text></g>; })}
      {hi >= 0 && <rect x={P.l + slot * hi + 2} y={P.t} width={Math.max(0, slot - 4)} height={ph} rx="4" fill="hsl(var(--muted) / .5)" />}
      {buckets.map((bk, i) => { let acc = 0; const x = P.l + slot * i + (slot - bw) / 2; return <g key={i} opacity={bk.partial ? .55 : 1}>
        {FUNCS.map((f, j) => { const v = bk[f.key], y1 = y(acc + v), y0 = y(acc); acc += v; const last = j === FUNCS.length - 1;
          return <rect key={f.key} x={x} y={y1} width={bw} height={Math.max(0, y0 - y1)} fill={f.color} rx={last ? 3 : 0} stroke="hsl(var(--card))" strokeWidth="1" />; })}
        {/* square off the bottom corners of the top segment */}
        {(() => { const yt = y(bk.total), ym = y(bk.total - bk[FUNCS[2].key]); return ym - yt > 6 ? <rect x={x} y={ym - 3} width={bw} height={3} fill={FUNCS[2].color} /> : null; })()}
        {(buckets.length - 1 - i) % every === 0 && (() => { const lx = x + bw / 2, lw = bk.label.length * 6.6, clip = lx + lw / 2 > w;
          return <text x={clip ? w : lx} y={H - 8} textAnchor={clip ? 'end' : 'middle'} fontSize="11" fill="hsl(var(--muted-foreground))">{bk.label}</text>; })()}
      </g>; })}
    </svg>}
    {b && <div className="pointer-events-none absolute top-2 z-10 grid min-w-[10rem] gap-1.5 rounded-lg border bg-background px-3 py-2 text-xs shadow-xl"
      style={cx > w / 2 ? { right: w - cx + Math.min(slot / 2, 22) + 6 } : { left: cx + Math.min(slot / 2, 22) + 6 }}>
      <div className="font-medium">{b.title}</div>
      {FUNCS.map(f => <div key={f.key} className="flex items-center gap-2"><span className="h-2.5 w-2.5 rounded-[2px]" style={{ background: f.color }} /><span className="text-muted-foreground">{f.label}</span><span className="ml-auto pl-4 font-mono font-medium tnum">{num(b[f.key])}</span></div>)}
      <div className="flex border-t pt-1.5 font-medium"><span>Total</span><span className="ml-auto font-mono tnum">{num(b.total)}</span></div>
    </div>}
  </div>;

        <Card fx={fx} className="h-full p-5">
          <div className="flex items-center justify-between gap-2 text-sm font-medium text-muted-foreground"><span className="truncate">{s.label}</span>{s.color && <span className="h-2 w-2 shrink-0 rounded-full" style={{ background: s.color }} />}</div>
          <div className="mt-2 text-2xl font-semibold"><CountUp value={d.cur[s.key]} fx={fx} /></div>
          <p className="mt-1 text-xs text-muted-foreground"><span className={cn('font-medium', c.tone !== 'muted' && 'text-foreground')}>{c.text}</span> from previous period</p>
        </Card></Reveal>; })}
    </div>
    <Reveal fx={fx} i={4}>
      <Card fx={fx} className="p-5 sm:p-6">
        <div className="mb-4 flex flex-wrap items-start justify-between gap-3">

  </div>;
}

function MealSheet({ meal, isNew, meals, onClose, onSave, onDelete }) {
  const [name, setName] = useState(meal.name), [photo, setPhoto] = useState(meal.photo), [ings, setIngs] = useState(meal.ingredients);
  const [add, setAdd] = useState(meal.addAllergens), [rm, setRm] = useState(meal.removeAllergens), [text, setText] = useState('');
  const [err, setErr] = useState({}), [ask, setAsk] = useState(false);
  const nameRef = useRef(null), fileRef = useRef(null), panelRef = useRef(null);
  const original = useRef(JSON.stringify([meal.name, meal.photo, meal.ingredients, meal.addAllergens, meal.removeAllergens]));
  const det = useMemo(() => detect(ings), [ings]);
  const on = n => (det.has(n) && !rm.includes(n)) || add.includes(n);
  const list = ALLERGENS.map(a => a.name).filter(on);
  const dirty = () => text.trim() || JSON.stringify([name, photo, ings, add, rm]) !== original.current;
  const close = () => dirty() ? setAsk(true) : onClose();

  useEffect(() => { setTimeout(() => nameRef.current && nameRef.current.focus(), 30); }, []);
  useEffect(() => { const k = e => { if (e.key === 'Escape') { e.preventDefault(); ask ? setAsk(false) : close(); } }; document.addEventListener('keydown', k); return () => document.removeEventListener('keydown', k); });

  const addText = t => {
    const parts = t.split(/[,;\n]+/).map(s => s.trim().replace(/\s+/g, ' ').slice(0, 60)).filter(Boolean);
    if (!parts.length) return ings;
    const next = [...ings]; parts.forEach(p => { if (!next.some(x => x.toLowerCase() === p.toLowerCase())) next.push(p); });
    setIngs(next); setErr(e => ({ ...e, ingr: null })); return next;
  };
  const toggle = n => det.has(n) ? setRm(r => r.includes(n) ? r.filter(x => x !== n) : [...r, n]) : setAdd(a => a.includes(n) ? a.filter(x => x !== n) : [...a, n]);
  const readPhoto = f => {
    if (!f) return;
    if (!/^image\//.test(f.type)) { setErr(e => ({ ...e, photo: 'Choose an image file (JPG, PNG or WebP).' })); return; }
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = () => { const k = Math.min(1, 800 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas'); c.width = img.naturalWidth * k; c.height = img.naturalHeight * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); setPhoto(c.toDataURL('image/jpeg', .8)); setErr(e => ({ ...e, photo: null })); };
    img.onerror = () => { URL.revokeObjectURL(url); setErr(e => ({ ...e, photo: 'This photo couldn’t be opened. Try a JPG or PNG.' })); };
    img.src = url;
  };
  const save = e => {
    e.preventDefault();
    const finalIngs = text.trim() ? addText(text) : ings; setText('');
    const n = name.trim().replace(/\s+/g, ' '), errs = {};
    if (!n) errs.name = 'Enter the meal’s name.';
    else if (meals.some(m => m.id !== meal.id && m.name.toLowerCase() === n.toLowerCase())) errs.name = 'Another meal already has this name.';
    if (!finalIngs.length) errs.ingr = 'Add at least one ingredient.';
    setErr(errs);
    if (Object.keys(errs).length) return;
    const d2 = detect(finalIngs);
    onSave({ ...meal, name: n, photo, ingredients: finalIngs, addAllergens: add.filter(a => !d2.has(a)), removeAllergens: rm.filter(a => d2.has(a)), sample: false });
  };
  const trap = e => {
    if (e.key !== 'Tab') return;
    const f = [...panelRef.current.querySelectorAll('button,input:not([type=file])')].filter(x => x.offsetParent);
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  };

  return <div className="fixed inset-0 z-50">
    <div className="overlay-in absolute inset-0 bg-black/70" onClick={close} />
    <form ref={panelRef} onSubmit={save} onKeyDown={trap} noValidate role="dialog" aria-modal="true" aria-labelledby="sheet-title"
      className="sheet-in absolute inset-y-0 right-0 flex w-full flex-col border-l bg-background shadow-lg sm:max-w-md"
      style={{ paddingTop: 'env(safe-area-inset-top,0px)', paddingBottom: 'env(safe-area-inset-bottom,0px)' }}>
      <div className="flex items-start justify-between gap-4 p-6 pb-4">
        <div><h2 id="sheet-title" className="text-lg font-semibold">{isNew ? 'Add meal' : 'Edit meal'}</h2>
          <p className="text-sm text-muted-foreground">The button uses this to translate, read aloud and warn about allergens.</p></div>
        <Button variant="ghost" size="icon" aria-label="Close" onClick={close}><Icon d={I.x} /></Button>
      </div>
      <div className="flex-1 space-y-6 overflow-y-auto px-6 pb-6">
        <div className="space-y-2">
          <label htmlFor="m-name" className="text-sm font-medium">Name</label>
          <Input id="m-name" ref={nameRef} value={name} maxLength={80} placeholder="e.g. Pad Thai" aria-invalid={!!err.name} aria-describedby="m-name-err"
            className={err.name && 'border-destructive'} onChange={e => { setName(e.target.value); setErr(x => ({ ...x, name: null })); }} />
          {err.name && <p id="m-name-err" className="text-sm text-destructive">{err.name}</p>}
        </div>
        <div className="space-y-2">
          <div className="text-sm font-medium">Photo <span className="font-normal text-muted-foreground">(optional)</span></div>
          <div className="flex items-center gap-3" onDragOver={e => e.preventDefault()} onDrop={e => { e.preventDefault(); readPhoto(e.dataTransfer.files[0]); }}>
            <Thumb meal={{ name: name || '?', photo }} size="h-16 w-16" />
            <div className="flex flex-wrap gap-2">
              <Button variant="outline" size="sm" onClick={() => fileRef.current.click()}><Icon d={I.image} />{photo ? 'Replace' : 'Upload'}</Button>
              {photo && <Button variant="ghost" size="sm" onClick={() => setPhoto('')}>Remove</Button>}
            </div>
            <input ref={fileRef} type="file" accept="image/*" hidden onChange={e => { readPhoto(e.target.files[0]); e.target.value = ''; }} />
          </div>
          {err.photo && <p className="text-sm text-destructive">{err.photo}</p>}
        </div>
        <div className="space-y-2">
          <label htmlFor="m-ingr" className="text-sm font-medium">Ingredients</label>
          <div className={cn('flex min-h-9 flex-wrap gap-1.5 rounded-md border border-input px-2 py-1.5 shadow-sm focus-within:ring-1 focus-within:ring-ring', err.ingr && 'border-destructive')}
            onClick={e => e.target === e.currentTarget && document.getElementById('m-ingr').focus()}>
            {ings.map((g, i) => { const flagged = [...det].some(([n, arr]) => on(n) && arr.includes(g));
              return <span key={g} className={cn('inline-flex items-center gap-1 rounded-md border py-0.5 pl-2 pr-1 text-xs', flagged ? 'border-foreground/25 bg-foreground/10 text-foreground' : 'bg-secondary')}>
                {g}<button type="button" aria-label={`Remove ${g}`} className="rounded-sm p-0.5 text-muted-foreground hover:text-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring"
                  onClick={() => setIngs(ings.filter((_, k) => k !== i))}><Icon d={I.x} className="size-3" /></button></span>; })}
            <input id="m-ingr" value={text} placeholder={ings.length ? 'Add another…' : 'Type and press Enter'} aria-describedby="m-ingr-help"
              className="min-w-[8rem] flex-1 bg-transparent px-1 text-sm outline-none placeholder:text-muted-foreground"
              onChange={e => setText(e.target.value)}
              onKeyDown={e => { if ((e.key === 'Enter' || e.key === ',') && !e.nativeEvent.isComposing) { e.preventDefault(); addText(text); setText(''); } else if (e.key === 'Backspace' && !text && ings.length) setIngs(ings.slice(0, -1)); }}
              onPaste={e => { const t = e.clipboardData.getData('text'); if (/[,;\n]/.test(t)) { e.preventDefault(); addText(text + ',' + t); setText(''); } }}
              onBlur={() => { if (text.trim()) { addText(text); setText(''); } }} />
          </div>
          <p id="m-ingr-help" className={cn('text-sm', err.ingr ? 'text-destructive' : 'text-muted-foreground')}>{err.ingr || 'Press Enter after each one, or paste a comma-separated list.'}</p>
        </div>
        <div className="space-y-2">
          <div className="text-sm font-medium">Allergens</div>
          <p className="text-sm text-muted-foreground">Found from the ingredient names. Tap to add or remove. Guests rely on this, so please check it.</p>
          <div className="flex flex-wrap gap-1.5">
            {ALLERGENS.map(({ name: n }) => { const pressed = on(n), auto = det.has(n);
              return <button key={n} type="button" aria-pressed={pressed} onClick={() => toggle(n)}
                title={auto ? (pressed ? 'Found in ' + det.get(n).join(', ') : 'Found, but turned off by you') : pressed ? 'Added by you' : 'Not found'}
                className={cn('inline-flex h-7 items-center gap-1 rounded-md border px-2.5 text-xs font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring',
                  pressed ? 'border-foreground/25 bg-foreground/10 text-foreground' : 'text-muted-foreground hover:bg-accent hover:text-foreground', auto && !pressed && 'line-through')}>
                {pressed && <Icon d={I.check} className="size-3" />}{n}</button>; })}
          </div>
          <p className="text-sm" aria-live="polite">{list.length ? <span>The button will warn guests about <span className="font-medium text-foreground">{listJoin(list)}</span>.</span> : <span className="text-muted-foreground">No allergen warnings for this meal.</span>}</p>
        </div>
      </div>
      <div className="flex flex-wrap items-center gap-2 border-t p-4 sm:px-6">
        {ask ? <>
          <span className="mr-auto text-sm font-medium">Discard your changes?</span>
          <Button variant="outline" onClick={() => setAsk(false)}>Keep editing</Button>
          <Button variant="destructive" onClick={onClose}>Discard</Button>
        </> : <>
          {!isNew && <Button variant="ghost" className="mr-auto text-muted-foreground" onClick={onDelete}><Icon d={I.trash} />Delete</Button>}
          <Button variant="outline" className={isNew ? 'ml-auto' : undefined} onClick={close}>Cancel</Button>
          <Button type="submit">{isNew ? 'Add meal' : 'Save changes'}</Button>
        </>}
      </div>
    </form>
  </div>;
}

  <div className="space-y-5">{children}</div></Card></Reveal>;
const Choice = ({ options, value, onChange, label }) => <div role="radiogroup" aria-label={label} className="grid grid-cols-2 gap-2 sm:grid-cols-4">
  {options.map(([v, t, d]) => <button key={v} type="button" role="radio" aria-checked={value === v} onClick={() => onChange(v)}
    className={cn('rounded-md border px-3 py-2 text-left text-sm transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring', value === v ? 'border-foreground bg-foreground/5' : 'hover:bg-accent')}>
    <div className="font-medium">{t}</div>{d && <div className="text-xs text-muted-foreground">{d}</div>}</button>)}
</div>;

function previewReply(kind, s, meals) {
  const name = s.name.trim() || 'your assistant';
  if (kind === 'hello') return s.greeting.replace(/\{name\}/g, name);
  const open = { friendly: 'Great question! ', professional: '', playful: 'Ooh, good one! ', calm: 'Of course. ' }[s.tone];
  if (!meals.length) return open + 'There are no meals on the menu yet, so I can’t answer that.';
  if (kind === 'allergen') {
    const m = meals.find(x => finalList(x.ingredients, x.addAllergens, x.removeAllergens).length) || meals[0];
    const al = finalList(m.ingredients, m.addAllergens, m.removeAllergens);
    let r = al.length ? `${open}The ${m.name} contains ${listJoin(al.map(a => a.toLowerCase()))}.` : `${open}The ${m.name} has none of the common allergens I check for.`;
    if (s.length === 'detailed') r += ` Its ingredients are ${listJoin(m.ingredients)}.`;
    if (s.disclaimer) r += s.tone === 'professional' ? ' Please confirm with a member of staff before ordering.' : ' Please double-check with our staff before you order.';
    return r;
  }
  const names = meals.map(m => m.name), n = { short: 3, balanced: 5, detailed: names.length }[s.length], more = names.length - Math.min(n, names.length);
  const intro = { friendly: 'Here’s what we have today:', professional: 'Today’s menu:', playful: 'Here comes the menu:', calm: 'Let me read you the menu.' }[s.tone];
  return `${intro} ${listJoin(names.slice(0, n))}${more > 0 ? `, and ${more} more` : ''}. ${s.length === 'short' ? 'Want details on one?' : 'Would you like to hear more about any dish?'}`;
}

function Preview({ s, fx }) {
  const meals = useMemo(loadMeals, []);
  const [kind, setKind] = useState('hello');
  const allergenMeal = meals.find(x => finalList(x.ingredients, x.addAllergens, x.removeAllergens).length) || meals[0];
  const asks = { hello: '(Guest presses the button)', allergen: `Does the ${allergenMeal ? allergenMeal.name : 'dish'} have any allergens?`, menu: 'Can you read me the menu?' };
  const reply = previewReply(kind, s, meals);
  const speak = () => {
    try {
      const synth = window.speechSynthesis;
      if (!synth) throw new Error();
      synth.cancel();
      const u = new SpeechSynthesisUtterance(reply);
      u.rate = s.speed; u.pitch = { warm: 1, bright: 1.25, deep: 0.75, neutral: 1 }[s.voice];
      synth.speak(u);
    } catch (e) { alertToast('This browser can’t play speech.'); }
  };
  const initial = (s.name.trim()[0] || '?').toUpperCase();
  return <Card fx={fx} className="p-5 sm:p-6">
    <div className="mb-4 flex items-center gap-3">
      <div className="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-primary text-sm font-semibold text-primary-foreground">{initial}</div>
      <div className="min-w-0"><div className="truncate font-semibold">{s.name.trim() || 'Unnamed assistant'}</div>
        <div className="truncate text-xs text-muted-foreground">{TONES.find(t => t[0] === s.tone)[1]} · speaks {s.languages.length} {s.languages.length === 1 ? 'language' : 'languages'}</div></div>
    </div>
    <div role="radiogroup" aria-label="Sample question" className="mb-4 flex flex-wrap gap-1.5">
      {[['hello', 'Greeting'], ['allergen', 'Allergens'], ['menu', 'Read menu']].map(([v, t]) => <button key={v} type="button" role="radio" aria-checked={kind === v} onClick={() => setKind(v)}
        className={cn('h-7 rounded-md border px-2.5 text-xs font-medium focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring', kind === v ? 'border-foreground bg-foreground text-background' : 'text-muted-foreground hover:bg-accent hover:text-foreground')}>{t}</button>)}
    </div>
    <div className="space-y-3 rounded-lg border bg-muted/30 p-4" aria-live="polite">
      <div className="ml-auto w-fit max-w-[85%] rounded-lg bg-secondary px-3 py-2 text-sm">{asks[kind]}</div>
      <div className="w-fit max-w-[90%] rounded-lg border bg-background px-3 py-2 text-sm leading-relaxed">{reply}</div>
    </div>
    <div className="mt-4 flex flex-wrap items-center justify-between gap-2">
      <p className="text-xs text-muted-foreground">Example replies built from your settings and menu. The live AI also follows your written instructions.</p>
      <Button variant="outline" size="sm" onClick={speak}><Icon d={I.play} />Listen</Button>
    </div>
  </Card>;
}
let alertToast = () => {};

function Assistant({ fx, toast, draft: s, setDraft, saved, setSaved }) {
  alertToast = toast;
  const set = (k, v) => setDraft(d => ({ ...d, [k]: v }));
  const dirty = JSON.stringify(s) !== JSON.stringify(saved);
  const errors = {};
  if (!s.name.trim()) errors.name = 'Give the assistant a name.';
  if (!s.greeting.trim()) errors.greeting = 'Add a greeting so guests know what the button can do.';
  const [tried, setTried] = useState(false);
  const save = () => {
    setTried(true);
    if (Object.keys(errors).length) { toast('Fix the highlighted fields first'); return; }
    const clean = { ...s, name: s.name.trim(), greeting: s.greeting.trim(), instructions: s.instructions.trim(), knowledge: s.knowledge.trim() };
    try { localStorage.setItem(ASSIST_KEY, JSON.stringify(clean)); } catch (e) {}
    setSaved(clean); setDraft(clean); setTried(false); toast('Assistant settings saved');
  };
  const toggleLang = l => {
    if (l === s.defaultLanguage) { toast(`${l} is the default language, so it stays on`); return; }
    set('languages', s.languages.includes(l) ? s.languages.filter(x => x !== l) : [...s.languages, l]);
  };
  const addExample = t => set('instructions', (s.instructions.trim() ? s.instructions.trim() + '\n' : '') + t);
  return <div className="space-y-6 pb-24">
    <div className="flex flex-wrap items-end justify-between gap-4">
      <div><h1 className="text-2xl font-semibold tracking-tight">Assistant</h1>
        <p className="text-sm text-muted-foreground">Choose how the AI on the button talks to your guests.</p></div>
      <Button variant="ghost" size="sm" onClick={() => { setDraft({ ...DEFAULT_ASSIST }); toast('Defaults restored. Save to keep them.'); }}>Reset to defaults</Button>
    </div>
    <div className="grid items-start gap-6 lg:grid-cols-[minmax(0,1fr)_360px]">
      <div className="space-y-6">
        <Section fx={fx} i={0} title="Identity" desc="What guests hear first.">
          <Field label="Name" htmlFor="a-name" hint="Guests can call the assistant by this name." error={tried && errors.name}>
            <Input id="a-name" value={s.name} maxLength={30} placeholder="e.g. Mila" className={tried && errors.name ? 'border-destructive' : undefined} onChange={e => set('name', e.target.value)} />
          </Field>
          <Field label="Greeting" htmlFor="a-greet" hint="Said when a guest presses the button. {name} becomes the assistant’s name." error={tried && errors.greeting}
            right={<span className="text-xs text-muted-foreground tnum">{s.greeting.length}/200</span>}>
            <Textarea id="a-greet" rows={3} maxLength={200} value={s.greeting} className={tried && errors.greeting ? 'border-destructive' : undefined} onChange={e => set('greeting', e.target.value)} />
          </Field>
        </Section>

        <Section fx={fx} i={1} title="Conversation style">
          <Field label="Tone"><Choice label="Tone" options={TONES} value={s.tone} onChange={v => set('tone', v)} /></Field>
          <Field label="Answer length" hint="Short answers work best when guests are in a hurry or using read-aloud.">
            <Tabs label="Answer length" value={s.length} onChange={v => set('length', v)} items={[['short', 'Short'], ['balanced', 'Balanced'], ['detailed', 'Detailed']]} />
          </Field>
        </Section>

        <Section fx={fx} i={2} title="Instructions" desc="Tell the assistant how to behave, in your own words.">
          <Field label="How should it talk to guests?" htmlFor="a-instr" right={<span className="text-xs text-muted-foreground tnum">{s.instructions.length}/2000</span>}>
            <Textarea id="a-instr" rows={6} maxLength={2000} value={s.instructions} onChange={e => set('instructions', e.target.value)}
              placeholder={'e.g. Greet families warmly. Suggest the kids’ menu when children are mentioned. Don’t use slang.'} />
          </Field>
          <div className="flex flex-wrap gap-1.5" aria-label="Example instructions">
            {EXAMPLES.map(t => <button key={t} type="button" onClick={() => addExample(t)} disabled={s.instructions.includes(t)}
              className="inline-flex h-7 items-center gap-1 rounded-md border px-2.5 text-xs text-muted-foreground hover:bg-accent hover:text-foreground disabled:opacity-40 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
              <Icon d={I.plus} className="size-3" />{t}</button>)}
          </div>
          <Field label="What should it know about your restaurant?" htmlFor="a-know" hint="Opening hours, Wi-Fi, where the restrooms are, house rules."
            right={<span className="text-xs text-muted-foreground tnum">{s.knowledge.length}/2000</span>}>
            <Textarea id="a-know" rows={4} maxLength={2000} value={s.knowledge} onChange={e => set('knowledge', e.target.value)} placeholder={'e.g. Open 11:00–22:00 daily. Kitchen closes at 21:30. Restrooms are past the bar.'} />
          </Field>
        </Section>

        <Section fx={fx} i={3} title="Languages and voice">
          <Field label="Default language" htmlFor="a-lang" hint="Used until the guest speaks another language.">
            <select id="a-lang" className={selectCls} value={s.defaultLanguage} onChange={e => { const l = e.target.value; setDraft(d => ({ ...d, defaultLanguage: l, languages: d.languages.includes(l) ? d.languages : [...d.languages, l] })); }}>
              {LANGS.map(l => <option key={l}>{l}</option>)}
            </select>
          </Field>
          <Field label="Languages it can translate into" right={<span className="text-xs text-muted-foreground">{s.languages.length} selected</span>}>
            <div className="flex flex-wrap gap-1.5">
              {LANGS.map(l => { const on = s.languages.includes(l); return <button key={l} type="button" aria-pressed={on} onClick={() => toggleLang(l)}
                className={cn('inline-flex h-7 items-center gap-1 rounded-md border px-2.5 text-xs font-medium focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring', on ? 'border-foreground/25 bg-foreground/10 text-foreground' : 'text-muted-foreground hover:bg-accent hover:text-foreground')}>
                {on && <Icon d={I.check} className="size-3" />}{l}</button>; })}
            </div>
          </Field>
          <div className="grid gap-5 sm:grid-cols-2">
            <Field label="Voice" htmlFor="a-voice">
              <select id="a-voice" className={selectCls} value={s.voice} onChange={e => set('voice', e.target.value)}>{VOICES.map(([v, t]) => <option key={v} value={v}>{t}</option>)}</select>
            </Field>
            <Field label="Speaking speed" htmlFor="a-speed" right={<span className="text-xs text-muted-foreground tnum">{s.speed.toFixed(2)}×</span>}>
              <input id="a-speed" type="range" min="0.75" max="1.5" step="0.05" value={s.speed} onChange={e => set('speed', +e.target.value)} className="mt-2 w-full accent-white" />
            </Field>
          </div>
        </Section>

        <Section fx={fx} i={4} title="Safety" desc="Recommended for anything about allergies.">
          {[['disclaimer', 'Ask guests to confirm allergens with staff', 'Adds a short reminder after every allergen answer.'],
            ['admitUnsure', 'Say “I’m not sure” instead of guessing', 'If an ingredient isn’t on the menu, the assistant says so and suggests asking staff.']].map(([k, t, d]) =>
            <div key={k} className="flex items-start justify-between gap-4">
              <div><div className="text-sm font-medium" id={'lbl-' + k}>{t}</div><p className="text-sm text-muted-foreground">{d}</p></div>
              <Switch checked={s[k]} label={t} onChange={v => set(k, v)} />
            </div>)}
        </Section>
      </div>
      <div className="lg:sticky lg:top-20"><Reveal fx={fx} i={1}><Preview s={s} fx={fx} /></Reveal></div>
    </div>
    {dirty && <div className="fixed inset-x-0 bottom-4 z-40 flex justify-center px-4" style={{ marginBottom: 'env(safe-area-inset-bottom,0px)' }}>
      <div className="toast-in flex w-full max-w-md flex-wrap items-center gap-3 rounded-lg border bg-background px-4 py-3 shadow-lg">
        <span className="mr-auto text-sm font-medium">You have unsaved changes</span>
        <Button variant="ghost" size="sm" onClick={() => { setDraft(saved); setTried(false); }}>Discard</Button>
        <Button size="sm" onClick={save}>Save changes</Button>
      </div>
    </div>}
  </div>;
}

/* ---------------- App ---------------- */
function App() {
  const hashTab = () => ({ '#menu': 'menu', '#assistant': 'assistant' })[location.hash] || 'usage';
  const [assistSaved, setAssistSaved] = useState(loadAssistant), [assistDraft, setAssistDraft] = useState(assistSaved);
  const [tab, setTab] = useState(hashTab);
  const [fx, setFx] = useState(() => !reduced && readPref('smartbutton.effects', 'off') === 'on');
  const [t, setT] = useState(null);
  useEffect(() => { const f = () => setTab(hashTab()); addEventListener('hashchange', f); return () => removeEventListener('hashchange', f); }, []);
  useEffect(() => { if (!t) return; const id = setTimeout(() => setT(null), t.action ? 6000 : 3000); return () => clearTimeout(id); }, [t]);
  const toast = useCallback((msg, action) => setT({ msg, action, id: Date.now() }), []);
  return <div className="min-h-screen">
    <header className="sticky z-30 border-b bg-background/80 backdrop-blur" style={{ top: 'env(safe-area-inset-top,0px)' }}>
      <div className="mx-auto flex h-14 max-w-5xl items-center gap-3 px-4 sm:gap-6 sm:px-6">
        <div className="flex items-center gap-2 font-semibold"><span className="grid h-6 w-6 place-items-center rounded-md bg-primary"><span className="h-2 w-2 rounded-full bg-primary-foreground" /></span><span className="hidden sm:inline">Smart Button</span></div>
        <Tabs label="Sections" value={tab} onChange={v => { location.hash = v; setTab(v); }} items={[['usage', 'Usage'], ['menu', 'Menu'], ['assistant', 'Assistant']]} />
        <label className="ml-auto flex cursor-pointer items-center gap-2 text-sm text-muted-foreground" title="ReactBits-style effects: count-up numbers, spotlight cards and fade-in">
          <Icon d={I.sparkles} /><span className="hidden sm:inline">Effects</span>
          <Switch checked={fx} label="Effects" onChange={v => { setFx(v); writePref('smartbutton.effects', v ? 'on' : 'off'); }} />
        </label>
      </div>
    </header>
    <main className="mx-auto max-w-5xl px-4 py-8 sm:px-6" key={tab + (fx ? '-fx' : '')}>
      {tab === 'usage' ? <Usage fx={fx} /> : tab === 'menu' ? <Menu fx={fx} toast={toast} /> : <Assistant fx={fx} toast={toast} draft={assistDraft} setDraft={setAssistDraft} saved={assistSaved} setSaved={setAssistSaved} />}
    </main>
    <div role="status" aria-live="polite" className="fixed bottom-4 right-4 z-[60] max-w-[calc(100%-2rem)]" style={{ marginBottom: 'env(safe-area-inset-bottom,0px)' }}>
      {t && <div key={t.id} className="toast-in flex items-center gap-4 rounded-lg border bg-background px-4 py-3 text-sm shadow-lg">
        <span>{t.msg}</span>
        {t.action && <Button size="sm" variant="secondary" onClick={() => { t.action.run(); setT(null); }}>{t.action.label}</Button>}
      </div>}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
